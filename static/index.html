<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 98vw;
            width: 360px;
            margin: 16px auto;
            background: #333;
            border-radius: 12px;
            box-shadow: 0 0 12px #000a;
            padding: 4vw 2vw 2vw 2vw;
        }
        .display-frame {
            width: 100%;
            max-width: 320px;
            height: auto;
            margin: 0 auto 18px auto;
            padding: 2px;
        }
        #display {
            width: 100%;
            max-width: 320px;
            height: auto;
            aspect-ratio: 4/3;
            image-rendering: pixelated;
            background: #fff;
            border-radius: 4px;
            border: 2px solid #fff;
            box-sizing: border-box;
            display: block;
            margin: 0 auto;
            transform: scaleX(-1);
        }
        .button-row {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            margin: 18px 0 10px 0;
            gap: 2vw;
        }
        .btn {
            flex: 1 1 0;
            background: #444;
            color: #fff;
            border: 2px solid #888;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 1.1em;
            margin: 0 2px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            min-width: 0;
            touch-action: manipulation;
        }
        .joystick {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        .joystick-row {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 180px;
            margin: 0;
            gap: 2vw;
        }
        .joy-btn {
            background: #222;
            color: #fff;
            border: 2px solid #888;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.5em;
            margin: 0 6px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            touch-action: manipulation;
        }
        .joy-center {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 400px) {
            .container {
                width: 98vw;
                padding: 2vw 1vw 1vw 1vw;
            }
            .display-frame, #display {
                max-width: 98vw;
            }
            .joystick-row {
                max-width: 98vw;
            }
            .joy-btn, .joy-center {
                width: 36px;
                height: 36px;
                font-size: 1.2em;
            }
            .btn {
                font-size: 1em;
                padding: 10px 0;
            }
        }
    </style>
    <script>
        function refreshDisplay() {
            const img = document.getElementById('display');
            img.src = '/display.png?ts=' + Date.now();
        }
        setInterval(refreshDisplay, 1000);
        window.onload = refreshDisplay;

        async function keyAction(key) {
            // Replace with your actual endpoint
            await fetch('/key', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({key: key})
            });
            refreshDisplay();
        }
        async function joystickAction(dir) {
            // Replace with your actual endpoint
            await fetch('/joystick', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({direction: dir})
            });
            refreshDisplay();
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="display-frame">
            <img id="display" src="/display.png" alt="Display"/>
        </div>
        <div class="button-row">
            <button class="btn" onclick="keyAction(3)">Key 3</button>
            <button class="btn" onclick="keyAction(2)">Key 2</button>
            <button class="btn" onclick="keyAction(1)">Key 1</button>
        </div>
        <div class="joystick">
            <button class="joy-btn" style="margin-bottom:6px;" onclick="joystickAction('up')">&#8593;</button>
            <div class="joystick-row">
                <button class="joy-btn" onclick="joystickAction('left')">&#8592;</button>
                <div class="joy-center">
                    <button class="joy-btn" onclick="joystickAction('press')">&#9679;</button>
                </div>
                <button class="joy-btn" onclick="joystickAction('right')">&#8594;</button>
            </div>
            <button class="joy-btn" style="margin-top:6px;" onclick="joystickAction('down')">&#8595;</button>
        </div>
    </div>
</body>
</html>
