<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timer Controller Display</title>
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 360px;
            margin: 30px auto;
            background: #333;
            border-radius: 12px;
            box-shadow: 0 0 12px #000a;
            padding: 24px 16px 16px 16px;
        }
        .display-frame {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            border: 1px solid #fff;    /* 1px white border */
            box-sizing: border-box;
            border-radius: 6px;
            width: 320px;
            height: 240px;
            margin: 0 auto 18px auto;
            box-shadow: 0 2px 8px #0004;
            padding: 2px;
        }
        #display {
            width: 320px;
            height: 240px;
            image-rendering: pixelated;
            background: #fff;
            border-radius: 4px;
            border: 2px solid #fff;   /* Add a 2px solid white border */
            box-sizing: border-box;   /* Ensure border is included in size */
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            margin: 18px 0 10px 0;
        }
        .btn {
            background: #444;
            color: #fff;
            border: 2px solid #888;
            border-radius: 6px;
            padding: 10px 28px;
            font-size: 1.1em;
            margin: 0 6px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }
        .btn:active {
            background: #666;
            border-color: #bbb;
        }
        .joystick {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }
        .joystick-row {
            display: flex;
            justify-content: center;
            width: 180px;
            margin: 0;
        }
        .joy-btn {
            background: #222;
            color: #fff;
            border: 2px solid #888;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.5em;
            margin: 0 10px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }
        .joy-btn:active {
            background: #555;
            border-color: #fff;
        }
        .joy-center {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spacer {
            height: 8px;
        }
    </style>
    <script>
        function refreshDisplay() {
            const img = document.getElementById('display');
            img.src = '/display.png?ts=' + Date.now();
        }
        setInterval(refreshDisplay, 1000);
        window.onload = refreshDisplay;

        async function keyAction(key) {
            // Replace with your actual endpoint
            await fetch('/key', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({key: key})
            });
            refreshDisplay();
        }
        async function joystickAction(dir) {
            // Replace with your actual endpoint
            await fetch('/joystick', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({direction: dir})
            });
            refreshDisplay();
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="display-frame">
            <img id="display" src="/display.png" alt="Display"/>
        </div>
        <div class="button-row">
            <button class="btn" onclick="keyAction(3)">Key 3</button>
            <button class="btn" onclick="keyAction(2)">Key 2</button>
            <button class="btn" onclick="keyAction(1)">Key 1</button>
        </div>
        <div class="joystick">
            <button class="joy-btn" style="margin-bottom:6px;" onclick="joystickAction('up')">&#8593;</button>
            <div class="joystick-row">
                <button class="joy-btn" onclick="joystickAction('left')">&#8592;</button>
                <div class="joy-center">
                    <button class="joy-btn" onclick="joystickAction('press')">&#9679;</button>
                </div>
                <button class="joy-btn" onclick="joystickAction('right')">&#8594;</button>
            </div>
            <button class="joy-btn" style="margin-top:6px;" onclick="joystickAction('down')">&#8595;</button>
        </div>
    </div>
</body>
</html>
